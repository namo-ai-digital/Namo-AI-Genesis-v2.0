name: Namo Genesis — Build & Test

on:
  push:
    paths:
      - "core/**"
      - "api/**"
      - "requirements.txt"
      - ".github/workflows/namo-build.yml"
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Smoke test - import modules
        run: |
          python - << 'PY'
          import importlib
          mods = ["core.emotional_mirror","core.memory_nexus","core.ethical_engine","core.reasoning_core","core.namo_ai"]
          for m in mods:
              importlib.import_module(m)
          print("OK: modules importable")
          PY

      - name: FastAPI starts check
        run: |
          python - << 'PY'
          from api.server import app
          assert app is not None
          print("OK: FastAPI app exists")
          PY
