name: Namo Genesis — Build & Test

on:
  push:
    paths:
      - "core/**"
      - "api/**"
      - "requirements.txt"
      - ".github/workflows/namo-build.yml"
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run smoke + FastAPI tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          python - <<'PY'
          import importlib
          from api.server import app

          mods = [
              "core.emotional_mirror",
              "core.memory_nexus",
              "core.ethical_engine",
              "core.reasoning_core",
              "core.namo_ai"
          ]
          for m in mods:
              importlib.import_module(m)

          assert app is not None, "FastAPI app not found!"
          print("✅ All core modules imported successfully")
          print("✅ FastAPI app exists and is importable")
          PY
